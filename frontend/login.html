<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center p-container-margin">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(40,44,63,0.08)] overflow-hidden relative">
<!-- Subtle top brand accent -->
<div class="h-2 w-full bg-primary-container"></div>
<div class="p-section-gap pt-8">
<!-- Header Section -->
<div class="mb-section-gap text-center">
<h1 class="font-headline-xl text-headline-xl text-primary font-black tracking-tight mb-2">Swigato</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back! Please enter your details.</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-gutter" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-base ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70 text-[20px]">mail</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-10 pr-4 py-3 rounded-lg border-0 outline-none focus:ring-2 focus:ring-primary-container transition-shadow placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-base ml-1">
<label class="block font-label-bold text-label-bold text-on-surface" for="password">Password</label>
<a class="font-label-bold text-label-bold text-primary-container hover:underline hover:text-primary transition-colors" href="forgot-password.html">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70 text-[20px]">lock</span>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md pl-10 pr-10 py-3 rounded-lg border-0 outline-none focus:ring-2 focus:ring-primary-container transition-shadow placeholder:text-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-white font-label-bold text-label-bold py-3.5 px-4 rounded-lg mt-2 shadow-sm hover:-translate-y-[1px] hover:shadow-md active:translate-y-0 active:shadow-sm transition-all flex items-center justify-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-section-gap">
<div class="flex-grow border-t border-surface-container-highest"></div>
<span class="flex-shrink-0 mx-4 font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">or continue with</span>
<div class="flex-grow border-t border-surface-container-highest"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-base">
<button class="w-full bg-surface-container-lowest border border-surface-container-highest text-on-surface font-label-bold text-label-bold py-3 px-4 rounded-lg hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.78 15.72 17.56V20.3H19.28C21.36 18.38 22.56 15.58 22.56 12.25Z" fill="#4285F4"></path>

<path d="M5.82 14.1C5.6 13.44 5.47 12.74 5.47 12C5.47 11.26 5.6 10.56 5.82 9.9V7.06H2.15C1.41 8.54 1 10.22 1 12C1 13.78 1.41 15.46 2.15 16.94L5.82 14.1Z" fill="#FBBC05"></path>
<path d="M12 5.38C13.62 5.38 15.06 5.94 16.2 7.02L19.35 3.87C17.46 2.11 14.97 1 12 1C7.69 1 3.96 3.47 2.15 7.06L5.82 9.9C6.7 7.31 9.13 5.38 12 5.38Z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<!-- Facebook simplified placeholder icon as requested to not use external if possible, but svg is fine for logos -->
<button class="w-full bg-surface-container-lowest border border-surface-container-highest text-on-surface font-label-bold text-label-bold py-3 px-4 rounded-lg hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3" type="button">
<svg aria-hidden="true" class="w-5 h-5 text-[#1877F2]" fill="currentColor" viewbox="0 0 24 24">

</svg>
                    Facebook
                </button>

<div class="mt-section-gap text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to Swigato? 
                    <a class="font-label-bold text-label-bold text-primary hover:underline transition-colors ml-1" href="register.html">Create an account</a>
</p>

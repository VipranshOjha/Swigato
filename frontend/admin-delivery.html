<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Partners — Swigato Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#fc8019', dark: '#e06b0a', light: '#fff4ec' }
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Top Nav -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a href="/index.html" class="text-brand font-extrabold text-xl tracking-tight">Swigato</a>
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest bg-gray-100 px-2 py-0.5 rounded">Admin</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/admin-dashboard.html" class="text-sm font-semibold text-gray-600 hover:text-brand">Restaurants</a>
                    <a href="/admin-delivery.html" class="text-sm font-semibold text-brand">Delivery Partners</a>
                    <div class="w-px h-4 bg-gray-300 mx-2"></div>
                    <span id="adminName" class="text-sm text-gray-600 font-medium"></span>
                    <button id="logoutBtn"
                            class="text-sm text-gray-500 hover:text-red-600 font-medium transition-colors flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">logout</span> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <div class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Delivery Partners</h1>
                <p class="text-gray-500 mt-1 text-sm">Manage riders, approvals, and suspensions.</p>
            </div>
            
            <div class="flex gap-4">
                <select id="filterVerified" class="text-sm rounded-md border-gray-300 shadow-sm focus:border-brand focus:ring-brand">
                    <option value="">All Verification Status</option>
                    <option value="true">Verified Only</option>
                    <option value="false">Unverified Only</option>
                </select>
            </div>
        </div>

        <!-- Loading -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-24 text-gray-400">
            <svg class="animate-spin h-8 w-8 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <p class="text-sm">Loading partners...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 text-center">
            <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-4xl text-gray-400">two_wheeler</span>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 mb-2">No partners found</h3>
            <p class="text-gray-500 text-sm mb-6 max-w-sm">
                No delivery partners match your current filters.
            </p>
        </div>

        <!-- Data Table -->
        <div id="tableContainer" class="hidden bg-white shadow-sm rounded-xl border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Partner</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Contact</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Vehicle</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Online/Avail</th>
                            <th scope="col" class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="partnersList" class="bg-white divide-y divide-gray-200">
                        <!-- Rendered via JS -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination Controls (Optional) -->
            <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between bg-gray-50">
                <button id="prevBtn" disabled class="px-3 py-1 text-sm border border-gray-300 rounded bg-white text-gray-700 disabled:opacity-50">Previous</button>
                <span id="pageInfo" class="text-sm text-gray-600">Page 1</span>
                <button id="nextBtn" disabled class="px-3 py-1 text-sm border border-gray-300 rounded bg-white text-gray-700 disabled:opacity-50">Next</button>
            </div>
        </div>

    </main>

    <!-- Toast container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/js/toast.js"></script>
    <script type="module" src="/js/admin-delivery.js"></script>
</body>
</html>

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-container-margin antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Main Container -->
<main class="w-full max-w-md">
<!-- Brand Logo -->
<div class="text-center mb-section-gap">
<h1 class="font-headline-xl text-headline-xl text-primary-container tracking-tight">Swigato</h1>
</div>
<!-- Card -->
<div class="bg-surface rounded-xl shadow-md p-8 border border-surface-container">
<!-- Header -->
<div class="mb-section-gap text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Forgot Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter the email address associated with your account and we'll send you a link to reset your password.
                </p>
</div>
<!-- Form -->
<form onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="mb-6">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary" style="font-size: 20px;">mail</span>
<input class="w-full bg-surface-container-low border-none rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary-container focus:bg-surface transition-all placeholder:text-secondary-fixed-dim" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary font-label-bold text-label-bold rounded-lg py-4 px-6 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined" style="font-size: 18px; font-variation-settings: 'wght' 600;">arrow_forward</span>
</button>
</form>
<!-- Back to Login Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-2 font-body-sm text-body-sm text-secondary hover:text-primary-container transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform" style="font-size: 16px;">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
<!-- Optional Support Link -->
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Need help? <a class="text-primary hover:underline font-label-bold text-label-bold" href="#">Contact Support</a>
</p>
</div>
</main>

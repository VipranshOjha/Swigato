<!DOCTYPE html>

                    "surface-container": "#ecedf8",

                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "surface-bright": "#faf9ff",
                    "tertiary": "#1b6d01",
                    "status-warning": "#DB7C38",
                    "on-secondary-fixed-variant": "#42465a",
                    "on-tertiary-fixed": "#032100",
                    "secondary-fixed-dim": "#c2c5de",
                    "secondary-container": "#dbdef8",
                    "surface-tint": "#984800",
                    "outline-variant": "#dec1b0",
                    "on-primary-fixed-variant": "#733500",
                    "tertiary-fixed-dim": "#86db69",
                    "on-tertiary-fixed-variant": "#115300",
                    "inverse-surface": "#2d3038",

            },
            "borderRadius": {

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-center p-container-margin">
<!-- Top Navigation is suppressed as this is a linear/transactional flow -->
<main class="w-full max-w-md mx-auto">
<!-- Logo -->
<div class="text-center mb-8">
<h1 class="font-headline-xl text-headline-xl text-primary-container tracking-tight">Swigato</h1>
</div>
<!-- Reset Password Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_2px_8px_rgba(40,44,63,0.08)] p-6 border border-surface-variant">
<!-- Header -->
<div class="mb-6">
<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Reset Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please create a new password that you don't use on any other site.</p>
</div>
<form class="space-y-6" id="reset-password-form">
<!-- New Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="new-password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-10 pr-10 py-3 bg-[#F2F2F3] border-none rounded-lg font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="new-password" name="new-password" placeholder="Enter new password" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePasswordVisibility('new-password', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Validation Markers -->
<div class="mt-3 space-y-1.5" id="password-validation">
<div class="flex items-center text-status-error font-body-sm text-body-sm transition-colors duration-300" id="req-length">
<span class="material-symbols-outlined text-[16px] mr-1.5">cancel</span>
                            At least 8 characters
                        </div>
<div class="flex items-center text-status-error font-body-sm text-body-sm transition-colors duration-300" id="req-number">
<span class="material-symbols-outlined text-[16px] mr-1.5">cancel</span>
                            Contains a number
                        </div>
<div class="flex items-center text-status-error font-body-sm text-body-sm transition-colors duration-300" id="req-special">
<span class="material-symbols-outlined text-[16px] mr-1.5">cancel</span>
                            Contains a special character
                        </div>
</div>
</div>
<!-- Confirm Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="confirm-password">Confirm New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock_reset</span>
<input class="w-full pl-10 pr-10 py-3 bg-[#F2F2F3] border-none rounded-lg font-body-md text-body-md text-on-surface focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="confirm-password" name="confirm-password" placeholder="Re-enter new password" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" onclick="togglePasswordVisibility('confirm-password', this)" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<div class="hidden mt-2 text-status-error font-body-sm text-body-sm flex items-center" id="match-error">
<span class="material-symbols-outlined text-[16px] mr-1">error</span>
                        Passwords do not match
                    </div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary py-3 rounded-lg font-headline-md text-headline-md opacity-50 cursor-not-allowed transition-all duration-300 flex justify-center items-center" disabled="" id="submit-btn" type="submit">
                    Update Password
                </button>
<div class="text-center mt-4">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors flex justify-center items-center" href="#">
<span class="material-symbols-outlined text-[18px] mr-1">arrow_back</span>
                        Back to Login
                    </a>
</div>
</form>
</div>
</main>
<!-- Bottom Navigation is suppressed as this is a linear/transactional flow -->
<!-- Footer is suppressed for focused transactional layout -->
<script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "visibility_off";
            } else {
                input.type = "password";
                icon.textContent = "visibility";
            }
        }

        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const submitBtn = document.getElementById('submit-btn');
        const matchError = document.getElementById('match-error');

        const reqLength = document.getElementById('req-length');
        const reqNumber = document.getElementById('req-number');
        const reqSpecial = document.getElementById('req-special');

        function updateValidationMarker(element, isValid) {
            const icon = element.querySelector('.material-symbols-outlined');
            if (isValid) {
                element.classList.remove('text-status-error');
                element.classList.add('text-status-success');
                icon.textContent = 'check_circle';
                // Apply 'fill' weight for success state if desired based on Material Symbols
                icon.style.fontVariationSettings = "'FILL' 1"; 
            } else {
                element.classList.remove('text-status-success');
                element.classList.add('text-status-error');
                icon.textContent = 'cancel';
                icon.style.fontVariationSettings = "'FILL' 0";
            }
        }

        function validatePassword() {
            const val = newPasswordInput.value;
            const confirmVal = confirmPasswordInput.value;
            
            const isLengthValid = val.length >= 8;
            const hasNumber = /\d/.test(val);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(val);
            
            updateValidationMarker(reqLength, isLengthValid);
            updateValidationMarker(reqNumber, hasNumber);
            updateValidationMarker(reqSpecial, hasSpecial);

            const isPasswordValid = isLengthValid && hasNumber && hasSpecial;
            const doPasswordsMatch = val === confirmVal && val !== '';

            if (confirmVal !== '') {
                if (!doPasswordsMatch) {
                    matchError.classList.remove('hidden');
                } else {
                    matchError.classList.add('hidden');
                }
            } else {
                matchError.classList.add('hidden');
            }

            if (isPasswordValid && doPasswordsMatch) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                submitBtn.classList.add('hover:bg-primary', 'hover:shadow-md');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                submitBtn.classList.remove('hover:bg-primary', 'hover:shadow-md');
            }
        }

        newPasswordInput.addEventListener('input', validatePassword);
        confirmPasswordInput.addEventListener('input', validatePassword);

        document.getElementById('reset-password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            if(!submitBtn.disabled) {
                // Simulate success
                submitBtn.innerHTML = '<span class="material-symbols-outlined mr-2 animate-spin">sync</span> Updating...';
                setTimeout(() => {
                    submitBtn.innerHTML = '<span class="material-symbols-outlined mr-2">check_circle</span> Success';
                    submitBtn.classList.remove('bg-primary-container');
                    submitBtn.classList.add('bg-status-success');
                }, 1500);
            }
        });
    </script>
</body></html>

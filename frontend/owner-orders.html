<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Orders — Swigato Partner</title>
    <meta name="description" content="Manage your restaurants on Swigato Partner portal.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#fc8019', dark: '#e06b0a', light: '#fff4ec' }
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .status-DRAFT { @apply bg-gray-100 text-gray-700; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- ── Top Nav ─────────────────────────────────────────────────────────── -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <a href="/index.html" class="text-brand font-extrabold text-xl tracking-tight">Swigato</a>
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest bg-gray-100 px-2 py-0.5 rounded">Partner</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="ownerName" class="text-sm text-gray-600 font-medium"></span>
                    <a href="/owner-dashboard.html" class="text-sm font-semibold text-gray-600 hover:text-brand transition-colors">Restaurants</a>
                    <a href="/owner-orders.html" class="text-sm font-bold text-brand transition-colors border-b-2 border-brand pb-1">Live Orders</a>
                    <button id="logoutBtn"
                            class="text-sm text-gray-500 hover:text-red-600 font-medium transition-colors">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ── Main ────────────────────────────────────────────────────────────── -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <div class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Live Orders</h1>
                <p class="text-gray-500 mt-1 text-sm">Manage active orders for your restaurants.</p>
            </div>
            <div>
                <select id="restaurantFilter" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none bg-white">
                    <option value="">All Restaurants</option>
                </select>
            </div>
        </div>

        <!-- Loading -->
        <div id="loadingState" class="flex flex-col items-center justify-center py-24 text-gray-400">
            <svg class="animate-spin h-8 w-8 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <p class="text-sm">Loading live orders...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-24 text-center">
            <div class="w-20 h-20 rounded-full bg-brand/10 flex items-center justify-center mb-6">
                <svg class="w-10 h-10 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 mb-2">No Active Orders</h3>
            <p class="text-gray-500 text-sm max-w-sm">
                You have no active orders to process right now.
            </p>
        </div>

        <div id="errorState" class="hidden flex flex-col items-center justify-center py-24 text-center">
            <span class="material-symbols-outlined text-error text-4xl mb-2 text-red-500">error</span>
            <p class="text-gray-500 text-sm mb-4">Failed to load orders.</p>
            <button onclick="window.location.reload()" class="px-4 py-2 bg-brand text-white rounded">Retry</button>
        </div>

        <!-- Orders Grid -->
        <div id="ordersGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>

    </main>

    <!-- Toast container (injected by toast.js) -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/js/protected.js"></script>
    <script type="module" src="/js/owner-orders.js"></script>
</body>
</html>

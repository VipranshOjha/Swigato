<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .otp-input:focus {
            outline: none;
            border-color: #fc8019;
            box-shadow: 0 0 0 1px #fc8019;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col justify-center items-center">
<div class="w-full max-w-md px-container-margin py-section-gap">
<div class="bg-surface-container-lowest rounded-xl shadow-md p-section-gap flex flex-col items-center text-center">
<div class="mb-6 bg-surface-container-low rounded-full p-6 inline-flex">
<span class="material-symbols-outlined text-primary-container" style="font-size: 48px; font-variation-settings: 'FILL' 1;">
                    mark_email_read
                </span>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Verify your email</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-section-gap">
                We've sent a 6-digit verification code to <br/>
<span class="font-bold text-on-surface">user@example.com</span>
</p>
<form class="w-full">
<div class="flex justify-between gap-2 mb-section-gap">
<input autofocus="" class="otp-input w-12 h-14 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-lg text-on-surface" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-lg text-on-surface" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-lg text-on-surface" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-lg text-on-surface" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-lg text-on-surface" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-lg text-headline-lg bg-surface-container-low border border-outline-variant rounded-lg text-on-surface" maxlength="1" type="text"/>
</div>
<button class="w-full bg-primary-container text-on-primary py-3 rounded-lg font-headline-md text-headline-md hover:bg-primary transition-colors active:scale-95 flex items-center justify-center gap-2" type="button">
                    Verify Email
                </button>
</form>
<div class="mt-6 flex flex-col items-center gap-2">
<p class="font-body-sm text-body-sm text-on-surface-variant">Didn't receive the code?</p>
<button class="font-label-bold text-label-bold text-primary-container hover:text-primary transition-colors flex items-center gap-1" type="button">
<span class="material-symbols-outlined" style="font-size: 16px;">refresh</span>
                    Resend Code
                </button>
</div>
<a class="mt-8 font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                Back to Sign In
            </a>
</div>
</div>
<script>
        const inputs = document.querySelectorAll('.otp-input');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });
    </script>
</body></html>

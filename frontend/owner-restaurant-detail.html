<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Restaurant — Swigato Partner</title>
    <meta name="description" content="Edit your restaurant details and manage approval status on Swigato.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#fc8019', dark: '#e06b0a', light: '#fff4ec' }
                    }
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- ── Top Nav ─────────────────────────────────────────────────────────── -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                    <a href="/owner-dashboard.html"
                       class="flex items-center gap-1 text-gray-500 hover:text-gray-800 text-sm font-medium transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                        My Restaurants
                    </a>
                    <span class="text-gray-300">|</span>
                    <span id="restaurantNameHeading" class="text-sm font-semibold text-gray-800 truncate max-w-xs">Loading...</span>
                </div>
                <div class="flex items-center gap-3">
                    <span id="ownerName" class="text-sm text-gray-500 hidden sm:inline"></span>
                    <button id="logoutBtn" class="text-sm text-gray-500 hover:text-red-600 font-medium transition-colors">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ── Main ────────────────────────────────────────────────────────────── -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 py-10">

        <!-- Status Banner (populated by JS) -->
        <div id="statusBanner" class="rounded-lg border p-4 mb-6 bg-gray-100 border-gray-300 text-gray-700">
            <p class="font-semibold">Loading status...</p>
        </div>

        <!-- Submit for Approval CTA -->
        <div class="flex justify-end mb-6">
            <button id="submitForApprovalBtn"
                    class="hidden bg-brand text-white font-semibold px-6 py-2.5 rounded-xl hover:bg-brand-dark transition-colors shadow-sm">
                Submit for Approval
            </button>
        </div>

        <!-- ── Edit Form ────────────────────────────────────────────────────── -->
        <form id="restaurantForm" class="space-y-8">

            <!-- Basic Info -->
            <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-base font-bold text-gray-900 mb-5 flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Basic Information
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantName">Restaurant Name *</label>
                        <input id="restaurantName" type="text" required
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantPhone">Phone *</label>
                        <input id="restaurantPhone" type="tel" required
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantEmail">Email *</label>
                        <input id="restaurantEmail" type="email" required
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantDescription">Description</label>
                        <textarea id="restaurantDescription" rows="3"
                                  class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition resize-none"
                                  placeholder="Tell customers about your restaurant..."></textarea>
                    </div>
                </div>
            </section>

            <!-- Location -->
            <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-base font-bold text-gray-900 mb-5 flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    Location
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantAddress">Full Address *</label>
                        <input id="restaurantAddress" type="text" required
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantCity">City *</label>
                        <input id="restaurantCity" type="text" required
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantState">State *</label>
                        <input id="restaurantState" type="text" required
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantPostalCode">Postal Code *</label>
                        <input id="restaurantPostalCode" type="text" required
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantCountry">Country</label>
                        <input id="restaurantCountry" type="text" value="India" readonly
                               class="w-full border border-gray-100 bg-gray-50 rounded-lg px-3 py-2.5 text-sm text-gray-500 cursor-not-allowed">
                    </div>
                </div>
            </section>

            <!-- Delivery Config -->
            <section class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <h2 class="text-base font-bold text-gray-900 mb-5 flex items-center gap-2">
                    <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    Delivery Configuration
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantDeliveryRadius">Delivery Radius (km)</label>
                        <input id="restaurantDeliveryRadius" type="number" step="0.1" min="0"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantMinOrder">Minimum Order (₹)</label>
                        <input id="restaurantMinOrder" type="number" step="0.01" min="0"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantDeliveryFee">Base Delivery Fee (₹)</label>
                        <input id="restaurantDeliveryFee" type="number" step="0.01" min="0"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="restaurantFreeDelivery">Free Delivery Above (₹)</label>
                        <input id="restaurantFreeDelivery" type="number" step="0.01" min="0"
                               placeholder="Leave empty to disable"
                               class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-brand/30 focus:border-brand outline-none transition">
                    </div>
                </div>
            </section>

            <!-- Save Button -->
            <div class="flex justify-end gap-3">
                <a href="/owner-dashboard.html"
                   class="px-5 py-2.5 text-sm font-semibold text-gray-600 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 transition-colors">
                    Cancel
                </a>
                <button id="saveBtn" type="submit"
                        class="px-6 py-2.5 text-sm font-semibold bg-brand text-white rounded-xl hover:bg-brand-dark transition-colors shadow-sm">
                    Save Changes
                </button>
            </div>

        </form>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/js/toast.js"></script>
    <script type="module" src="/js/owner-restaurant-detail.js"></script>
</body>
</html>

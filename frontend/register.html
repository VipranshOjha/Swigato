<!DOCTYPE html>

<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col justify-center items-center p-4">
<!-- Note: TopNavBar and BottomNavBar are suppressed as this is a transactional page (Sign-up). -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden relative z-10">
<!-- Header Image Area -->
<div class="h-32 bg-surface-container-high relative flex items-center justify-center overflow-hidden">
<img alt="Appetizing food background" class="absolute inset-0 w-full h-full object-cover opacity-60" data-alt="A vibrant, modern flat-lay photograph of delicious gourmet burgers and crispy fries scattered artistically on a clean, light surface. The lighting is bright and inviting, typical of high-end food delivery apps, emphasizing freshness and energy. The scene is slightly desaturated to act as a stylish, energetic background for a corporate food delivery interface, matching a clean white and vibrant orange aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuApNBBuvX1I3di0hptESsZrTkwRnf1uKtHBaIvKpRxE2FYbSzftT_Atwv794a0B-HHaJyn5LaRoF8DLmC6oLYyUmjHRBbmL0ywKzFwouUWS_w9JUJeIHfQMdinxnGrKFU8GH81R5rXlKFIb0jO2MqlppyvIC4FAuQ_iYFi1ywgSWme4LG_OOMiy1GHmxAtZrMNkiC1DPhO7IhPlcWZ9-s3b51Uv8p9G8V7Th150cqSwC0B-cOgaD4-MOTvQYLjHDeaBgDpY33Fhyjg"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest to-transparent"></div>
<div class="relative z-10 text-center">
<h1 class="font-headline-xl text-headline-xl text-primary font-black tracking-tight drop-shadow-sm">Swigato</h1>
</div>
</div>
<!-- Form Area -->
<div class="p-section-gap">
<div class="mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign up to start ordering your favorite food.</p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 font-body-md text-body-md text-on-surface bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-colors placeholder-on-surface-variant/50" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 font-body-md text-body-md text-on-surface bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-colors placeholder-on-surface-variant/50" id="email" name="email" placeholder="john@example.com" required="" type="email"/>
</div>
</div>
<!-- Phone Number -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="phone">phone</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 font-body-md text-body-md text-on-surface bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-colors placeholder-on-surface-variant/50" id="phone" name="phone" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 font-body-md text-body-md text-on-surface bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-colors placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Terms -->
<div class="flex items-start">
<div class="flex items-center h-5">
<input class="focus:ring-primary-container h-4 w-4 text-primary-container border-outline rounded bg-surface-container-lowest" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            I agree to the <a class="font-bold text-primary hover:underline" href="#">Terms of Service</a> and <a class="font-bold text-primary hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-bold text-label-bold text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors active:scale-95 duration-150" type="submit">
                    Create Account
                </button>
</form>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="font-bold text-primary hover:text-primary-container hover:underline transition-colors" href="login.html">Sign In</a>
</p>
</div>
</div>
</main>
<!-- Decorative background elements -->
<div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary-fixed opacity-20 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-secondary-fixed opacity-20 rounded-full blur-3xl"></div>
<script type="module" src="/js/register.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants - Swigato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="/index.html" class="text-2xl font-bold text-orange-600 tracking-tight">Swigato</a>
            </div>
            <div class="flex items-center gap-4 text-sm" id="authSection">
                <a href="/login.html" class="font-medium text-gray-600 hover:text-orange-600">Login</a>
                <a href="/register.html" class="font-medium bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-4 md:mb-0">Restaurants in <span id="currentCity" class="text-orange-600">Your City</span></h1>
            
            <div class="flex gap-4 w-full md:w-auto">
                <input type="text" id="searchInput" placeholder="Search for restaurants..." class="flex-grow md:w-64 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-orange-500 focus:border-orange-500">
                <input type="text" id="cityInput" placeholder="City" value="Admin City" class="w-32 px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-orange-500 focus:border-orange-500">
                <button id="searchBtn" class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 shadow-sm">Search</button>
            </div>
        </div>

        <div id="loadingState" class="text-center py-10 hidden">
            <p class="text-gray-500">Loading restaurants...</p>
        </div>

        <div id="errorState" class="text-center py-10 hidden text-red-600">
            <p>Failed to load restaurants.</p>
        </div>

        <!-- Grid -->
        <div id="restaurantsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Restaurants injected here -->
        </div>

        <div id="emptyState" class="text-center py-16 hidden">
            <h3 class="text-lg font-medium text-gray-900">No restaurants found</h3>
            <p class="text-gray-500 mt-2">Try changing your search or city</p>
        </div>
    </main>

    <script type="module" src="/js/restaurants.js"></script>
</body>
</html>

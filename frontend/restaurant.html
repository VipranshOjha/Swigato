<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Restaurant Details - Swigato</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed": "#a1f882",
                        "primary-fixed-dim": "#ffb689",
                        "on-tertiary-fixed-variant": "#115300",
                        "secondary": "#5a5d73",
                        "surface-tint": "#984800",
                        "on-secondary-fixed": "#161b2d",
                        "surface-container-high": "#e6e7f2",
                        "on-secondary-container": "#5e6177",
                        "surface-container": "#ecedf8",
                        "on-error-container": "#93000a",
                        "primary": "#984800",
                        "on-tertiary-container": "#0c4200",
                        "tertiary": "#1b6d01",
                        "on-primary-fixed": "#311300",
                        "surface": "#faf9ff",
                        "on-secondary-fixed-variant": "#42465a",
                        "on-primary-fixed-variant": "#733500",
                        "secondary-fixed": "#dee1fa",
                        "on-background": "#191b23",
                        "surface-dark": "#171A29",
                        "outline": "#8b7264",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2d3038",
                        "inverse-on-surface": "#eff0fb",
                        "primary-container": "#fc8019",
                        "on-tertiary-fixed": "#032100",
                        "status-error": "#E13D45",
                        "surface-bright": "#faf9ff",
                        "primary-fixed": "#ffdbc8",
                        "on-surface": "#191b23",
                        "error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#86db69",
                        "surface-container-low": "#f2f3fe",
                        "surface-dim": "#d8d9e4",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#c2c5de",
                        "on-tertiary": "#ffffff",
                        "status-success": "#60B246",
                        "on-surface-variant": "#574236",
                        "secondary-container": "#dbdef8",
                        "tertiary-container": "#63b549",
                        "surface-variant": "#e1e2ed",
                        "outline-variant": "#dec1b0",
                        "status-warning": "#DB7C38",
                        "background": "#faf9ff",
                        "surface-background": "#FFFFFF",
                        "on-primary-container": "#5e2a00",
                        "surface-container-highest": "#e1e2ed",
                        "inverse-primary": "#ffb689"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "32px",
                        "gutter": "16px",
                        "container-margin": "16px",
                        "base": "8px",
                        "card-padding": "12px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-xl": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-bold": ["Inter"],
                        "price-display": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-bold": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "price-display": ["16px", { "lineHeight": "20px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .veg-icon { width: 12px; height: 12px; border: 1px solid #60B246; display: inline-flex; align-items: center; justify-content: center; border-radius: 2px; }
        .veg-icon::after { content: ''; width: 6px; height: 6px; background-color: #60B246; border-radius: 50%; }
        .non-veg-icon { width: 12px; height: 12px; border: 1px solid #E13D45; display: inline-flex; align-items: center; justify-content: center; border-radius: 2px; }
        .non-veg-icon::after { content: ''; width: 0; height: 0; border-left: 3px solid transparent; border-right: 3px solid transparent; border-bottom: 6px solid #E13D45; }
    </style>
</head>
<body class="bg-surface dark:bg-surface-dark text-on-surface dark:text-on-surface antialiased flex flex-col min-h-screen">
    <!-- TopAppBar -->
    <header class="sticky top-0 z-50 flex justify-between items-center w-full px-gutter h-16 bg-surface dark:bg-surface-dark shadow-sm">
        <div class="flex items-center gap-4">
            <a href="/" class="p-2 hover:bg-surface-container-low rounded-full transition-colors flex items-center justify-center">
                <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
            </a>
            <h1 class="font-headline-xl text-headline-xl font-black text-primary dark:text-primary-container">Swigato</h1>
        </div>
        <div class="flex items-center gap-4" id="authSection">
            <a href="/login.html" class="text-on-surface-variant dark:text-on-secondary-container hover:text-primary transition-colors duration-200">
                <span class="material-symbols-outlined" data-icon="person">person</span>
            </a>
            <a href="/cart.html" class="text-on-surface-variant dark:text-on-secondary-container hover:text-primary transition-colors duration-200">
                <span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
            </a>
        </div>
    </header>

    <div id="loadingState" class="text-center py-20 flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-container mb-4"></div>
        <p class="font-body-md text-body-md text-on-surface-variant">Loading restaurant details...</p>
    </div>

    <div id="errorState" class="hidden text-center py-20">
        <span class="material-symbols-outlined text-4xl text-error mb-2">error</span>
        <p id="errorMsg" class="font-body-md text-body-md text-error">Failed to load restaurant details. Please try again.</p>
        <a href="/" class="mt-4 inline-block text-primary hover:underline">Go back home</a>
    </div>

    <!-- Main Content Canvas -->
    <main id="mainContent" class="hidden flex-grow pb-24 md:pb-8">
        <!-- Hero Section -->
        <div class="relative w-full h-48 md:h-64 lg:h-80 bg-surface-variant" id="coverImageContainer">
            <div class="absolute inset-0 bg-gradient-to-t from-on-background/80 to-transparent z-10"></div>
            <div class="absolute bottom-0 left-0 right-0 p-container-margin md:px-8 lg:px-16 text-on-primary z-20">
                <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:justify-between md:items-end gap-4">
                    <div>
                        <h1 id="restaurantName" class="font-headline-xl text-headline-xl text-on-primary mb-2">Restaurant Name</h1>
                        <p id="restaurantCategories" class="font-body-md text-body-md text-on-primary/80 mb-3">Categories • Location</p>
                        <div class="flex items-center gap-4 text-on-primary font-label-bold text-label-bold">
                            <div class="flex items-center gap-1 bg-status-success text-on-primary px-2 py-1 rounded">
                                <span class="material-symbols-outlined text-[14px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                                <span id="restaurantRating">NEW</span>
                            </div>
                            <div class="flex items-center gap-1 bg-surface-dark/50 px-2 py-1 rounded backdrop-blur-sm" id="deliveryTimeContainer">
                                <span class="material-symbols-outlined text-[14px]" data-icon="schedule">schedule</span>
                                <span>30-40 mins</span>
                            </div>
                        </div>
                    </div>
                    <!-- Special Offers Badge (Dynamic later) -->
                    <div id="freeDeliveryAbove" class="hidden bg-primary-container text-on-primary px-4 py-2 rounded-lg shadow-sm flex items-center gap-2 max-w-max">
                        <span class="material-symbols-outlined" data-icon="local_offer">local_offer</span>
                        <div>
                            <p class="font-label-bold text-label-bold" id="freeDeliveryText"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="max-w-4xl mx-auto mt-section-gap px-container-margin">
            <!-- Sticky Category Nav -->
            <nav id="categoryNav" class="hidden sticky top-16 z-40 bg-surface dark:bg-surface-dark py-4 -mx-container-margin px-container-margin overflow-x-auto no-scrollbar border-b border-surface-variant">
                <div class="flex gap-4" id="categoryNavItems">
                    <!-- Nav items will go here -->
                </div>
            </nav>

            <!-- Menu Content -->
            <div class="mt-8 space-y-section-gap" id="restaurantMenu">
                <!-- Menu categories and items will be rendered here -->
            </div>
        </div>
    </main>

    <!-- Floating Cart Summary -->
    <div id="floatingCartSummary" class="hidden fixed bottom-0 left-0 w-full z-50 p-4 animate-in fade-in slide-in-from-bottom-4 duration-500">
        <a href="/cart.html" class="block bg-primary-container text-on-primary rounded-lg shadow-lg p-4 flex justify-between items-center cursor-pointer hover:bg-primary transition-colors">
            <div class="flex flex-col">
                <p class="font-headline-md text-headline-md" id="floatingCartTotalText">View your cart</p>
            </div>
            <div class="flex items-center gap-1 font-headline-md text-headline-md">
                View Cart
                <span class="material-symbols-outlined" data-icon="arrow_right_alt">arrow_right_alt</span>
            </div>
        </a>
    </div>

    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/restaurant.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Details - Swigato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="/restaurants.html" class="text-orange-600 hover:text-orange-700 flex items-center gap-1 font-medium">
                    ← Back to Restaurants
                </a>
            </div>
            <div class="flex items-center gap-4 text-sm" id="authSection">
                <a href="/login.html" class="font-medium text-gray-600 hover:text-orange-600">Login</a>
            </div>
        </div>
    </nav>

    <div id="loadingState" class="text-center py-20">
        <p class="text-gray-500">Loading restaurant details...</p>
    </div>

    <div id="errorState" class="text-center py-20 hidden text-red-600">
        <p id="errorMsg">Restaurant not found.</p>
        <a href="/restaurants.html" class="mt-4 inline-block text-orange-600 hover:underline">Go back</a>
    </div>

    <!-- Main Content -->
    <main id="mainContent" class="hidden">
        <!-- Hero -->
        <div class="bg-gray-900 h-64 relative overflow-hidden">
            <div id="coverImage" class="absolute inset-0 bg-gray-800 opacity-50"></div>
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full flex flex-col justify-end pb-8 relative z-10">
                <div class="flex items-end gap-6">
                    <div class="w-32 h-32 bg-white rounded-lg shadow-lg border-4 border-white overflow-hidden" id="logoContainer">
                        <div class="w-full h-full bg-gray-200"></div>
                    </div>
                    <div class="text-white mb-2">
                        <h1 id="restaurantName" class="text-4xl font-bold">Restaurant Name</h1>
                        <p id="restaurantCategories" class="text-gray-300 mt-1">Categories • Categories</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left col -->
            <div class="lg:col-span-2 space-y-8">
                <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-4">About</h2>
                    <p id="restaurantDescription" class="text-gray-600 leading-relaxed"></p>
                </section>
                
                <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-4">Menu</h2>
                    <div class="text-center py-10 border-2 border-dashed border-gray-200 rounded-lg">
                        <p class="text-gray-500">Menu items will appear here (Phase 4).</p>
                    </div>
                </section>
            </div>

            <!-- Right col -->
            <div class="space-y-6">
                <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="font-bold text-gray-900 mb-4 text-lg">Info</h3>
                    <div class="space-y-4 text-sm">
                        <div class="flex items-start gap-3">
                            <span class="text-gray-400 mt-0.5">📍</span>
                            <div>
                                <p id="restaurantAddress" class="text-gray-900"></p>
                                <p id="restaurantCityState" class="text-gray-500"></p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-gray-400">📞</span>
                            <p id="restaurantPhone" class="text-gray-900"></p>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-gray-400">✉️</span>
                            <p id="restaurantEmail" class="text-gray-900"></p>
                        </div>
                    </div>
                </section>

                <section class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <h3 class="font-bold text-gray-900 mb-4 text-lg">Delivery Details</h3>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500">Base Fee</span>
                            <span id="deliveryFee" class="font-medium text-gray-900"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Min Order</span>
                            <span id="minOrder" class="font-medium text-gray-900"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Radius</span>
                            <span id="deliveryRadius" class="font-medium text-gray-900"></span>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script type="module" src="/js/restaurant.js"></script>
</body>
</html>
